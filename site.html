<!DOCTYPE html>
<html lang="ua">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Themed Page</title>
	<link rel="stylesheet" type="text/css" href="./style.css">
	<link 
		rel="stylesheet" 
		href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" 
		integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" 
		crossorigin="anonymous" 
		referrerpolicy="no-referrer"
		/>
</head>
<body>	
	<header class="header">
		<div class="header-left">
			<img src="./img/logo.png" alt="" class="header-logo">
			<nav>
				<ul class="menu-list">
					<li>About</li>
					<li>Service</li>
					<li>FAQ</li>
					<li>Contacts</li>
				</ul>
			</nav>
		</div>
		<div class="header-right">
			<div class="header-icon">
        <i class="fa-brands fa-facebook-f"></i>
      </div>
      <div class="header-icon">
        <i class="fa-brands fa-instagram"></i>
      </div>
      <div class="header-icon">
        <i class="fa-regular fa-envelope"></i>
      </div>
			<button class="button button-primary">+380506914141</button>
		</div>
	</header>

  <main>
  	<section class="banner">
  		<div class="banner-left">
  			<span class="banner-note">we are expert in</span>
				<h1 class="banner-title">business solutions</h1>
  		</div>
  		<div class="banner-right">
  		  <img src="./img/banner-img.svg" alt="banner-img" class="banner-img">
  		</div>

  		<div class="benefits">
  			<div class="benefit-item">
					<div class="benefit-icon"><i class="fa-solid fa-star"></i></div>
					<div>
						<h4 class="benefit-title">Smart Solutions</h4>
						<span class="benefit-text">Optimize your workflow easily</span>
					</div>
				</div>

				<div class="benefit-item">
					<div class="benefit-icon"><i class="fa-solid fa-truck-fast"></i></div>
					<div>
						<h4 class="benefit-title">Fast Performance</h4>
						<span class="benefit-text">Experience lightning-fast speed</span>
					</div>
				</div>

				<div class="benefit-item">
					<div class="benefit-icon"><i class="fa-solid fa-shield-halved"></i></div>
					<div>
						<h4 class="benefit-title">24/7 Support</h4>
						<span class="benefit-text">Help anytime you need</span>
					</div>
				</div>
  		</div>
  	</section>
  </main>
</body>
</html>
