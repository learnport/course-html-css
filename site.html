<!DOCTYPE html>
<html lang="ua">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Форми</title>
	<link rel="stylesheet" type="text/css" href="./style.css">
</head>
<body>
	<div class="wrap">
		<form class="container">
			<h2 class="title">Реєстрація</h2>

			<fieldset class="form-block">
				<label for="name">Як до вас звертатись?</label>
				<input 
					id="name"
					placeholder="Ім'я" 
					class="input" 
					type="text" 
					name="name"
				>
			</fieldset>

			 <fieldset class="form-block">
	      <label for="experience">Досвід в роках</label>
	      <input
	        class="input"
	        id="experience"
	        name="experience"
	        type="number"
	        placeholder="0"
	      >
	    </fieldset>

	    <fieldset class="form-block">
	      <label for="birthday">Дата Народження</label>
	      <input
	        class="input"
	        id="birthday"
	        name="birthday"
	        type="date"
	        placeholder="Вік"
	      >
	    </fieldset>

	    <fieldset class="form-block">
	    	<label>Країна</label>
	    	<select class="select">
	    		<option value="ua">Україна</option>
	    		<option value="fr">Франція</option>
	    		<option value="en">Англія</option>
	    	</select>
	    </fieldset>

	    <fieldset class="form-block">
	      <label for="password">Пароль</label>
	      <input
	        class="input"
	        id="password"
	        name="password"
	        type="password"
	        placeholder="******"
	      >
	    </fieldset>

	    <button class="btn" type="submit">Створити Аккаунт</button>
		</form>
	</div>
</body>
</html>
